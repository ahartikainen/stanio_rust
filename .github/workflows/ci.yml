name: Quality, Native Tests and Wheels

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: cargo fmt --all
      - run: cargo clippy --all-targets

  upstream-stanio:
    name: Original stan-dev/stanio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin
      - run: python -m pip install -e '.[test]'
      # Preserve the upstream test sources and their original fixtures.
      - run: git clone --depth 1 https://github.com/stan-dev/stanio.git upstream-stanio
      - run: python scripts/run_upstream_stanio_tests.py upstream-stanio

  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            manylinux: '2_17'
            interpreter: python3.12
          - platform: windows-amd64
            os: windows-latest
            manylinux: 'off'
            interpreter: python
          - platform: macos-x86_64
            os: macos-15-intel
            manylinux: 'off'
            interpreter: python
          - platform: macos-arm64
            os: macos-15
            manylinux: 'off'
            interpreter: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      # One cp310-abi3 wheel per platform supports CPython 3.10+ (GIL builds).
      - name: Build distributable wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i ${{ matrix.interpreter }}

      - name: Verify the wheel has a stable-ABI tag
        run: python -c "import glob, pathlib; paths = glob.glob('dist/*.whl'); assert len(paths) == 1, paths; assert '-cp310-abi3-' in pathlib.Path(paths[0]).name, paths; print(paths[0])"

      - name: Install the built wheel, not the editable source
        run: |
          python -m pip install numpy psutil
          python -m pip install --no-index --no-deps --find-links dist stanio_rust
      - name: Import the installed native extension
        run: python -c "import staniorust, staniorust._native; print('staniorust native wheel imported successfully')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # A published GitHub Release triggers a fresh wheel build from its tag.
  # Upload only if the tests and every platform wheel succeeded.
  release-wheels:
    name: Attach wheels to GitHub Release
    if: github.event_name == 'release'
    needs: [lint, test, upstream-stanio, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels built by this workflow run
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Verify all four platform wheels match the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 4:
              raise SystemExit(f"Expected 4 wheels, found {len(wheels)}: {wheels}")
          if not all(w.name.startswith(f"stanio_rust-{version}-cp310-abi3-") for w in wheels):
              raise SystemExit(f"Wheel versions/ABI do not match release tag {tag}: {wheels}")

          names = [w.name for w in wheels]
          platforms = {
              "linux-x86_64": lambda n: "manylinux" in n and "x86_64" in n,
              "windows-amd64": lambda n: n.endswith("win_amd64.whl"),
              "macos-x86_64": lambda n: "macosx" in n and "x86_64" in n,
              "macos-arm64": lambda n: "macosx" in n and "arm64" in n,
          }
          for platform, match in platforms.items():
              if sum(match(name) for name in names) != 1:
                  raise SystemExit(f"Expected one wheel for {platform}: {names}")
          print("Verified wheels for release", tag, *names, sep="\n  ")
          PYCODE

      - name: Attach wheels to the published release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.whl
          fail_on_unmatched_files: true
