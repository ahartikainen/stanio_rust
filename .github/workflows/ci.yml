name: Quality, Native Tests and Wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: cargo fmt --all
      - run: cargo clippy --all-targets

  upstream-stanio:
    name: Original stan-dev/stanio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin
      - run: python -m pip install -e '.[test]'
      # Preserve the upstream test sources and their original fixtures.
      - run: git clone --depth 1 https://github.com/stan-dev/stanio.git upstream-stanio
      - run: python scripts/run_upstream_stanio_tests.py upstream-stanio

  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            manylinux: '2_17'
            interpreter: python3.12
          - platform: windows-amd64
            os: windows-latest
            manylinux: 'off'
            interpreter: python
          - platform: macos-x86_64
            os: macos-15-intel
            manylinux: 'off'
            interpreter: python
          - platform: macos-arm64
            os: macos-15
            manylinux: 'off'
            interpreter: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      # One cp310-abi3 wheel per platform supports CPython 3.10+ (GIL builds).
      - name: Build distributable wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i ${{ matrix.interpreter }}

      - name: Verify the wheel has a stable-ABI tag
        run: python -c "import glob, pathlib; paths = glob.glob('dist/*.whl'); assert len(paths) == 1, paths; assert '-cp310-abi3-' in pathlib.Path(paths[0]).name, paths; print(paths[0])"

      - name: Install the built wheel, not the editable source
        run: |
          python -m pip install numpy psutil
          python -m pip install --no-index --no-deps --find-links dist stanio_rust
      - name: Import the installed native extension
        run: python -c "import staniorust, staniorust._native; print('staniorust native wheel imported successfully')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
