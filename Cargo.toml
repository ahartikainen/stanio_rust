[package]
name = "stanio-rust-native"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "Rust native parser, mmap reader and streaming statistics for CmdStan CSV"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py310"] }
numpy = "0.24"
ndarray = "0.16"
serde = "1.0"
serde_json = "1.0"
memmap2 = "0.9"
memchr = "2.7"
rayon = "1.10"
